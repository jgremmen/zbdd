# CI script
image: localhost:5000/sayayi-jdk:lts

stages:
  - build

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: ".gradle-cache"
  ZBDD_WINE_JAVA: "1"

before_script:
  - export JAVA_HOME="/usr/lib/jvm/jdk-21"

cache:
  paths:
    - .gradle-cache

build:
  stage: build
  tags:
    - docker
  script:
    - ./gradlew clean build --stacktrace
  artifacts:
    name: "zbdd-artifacts"
    paths:
      - .build/libs/*.jar
    expire_in: 2 weeks
