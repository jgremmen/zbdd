plugins {
  id 'java-library'
  id 'com.adarshr.test-logger' version '4.0.0'
}


description =
    'A Java implementation of Shin-ichi Minato\'s Zero-Suppressed Binary Decision Diagrams (ZBDDs), providing a ' +
    'compact, efficient data structure for representing and manipulating families of sets, with support for core set ' +
    'operations, algebraic operations, reference-counted garbage collection and optional thread-safe, cached access.'
group = 'de.sayayi.lib'
version = libs.versions.zbdd.get()


layout.buildDirectory = '.build'


java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }

  withSourcesJar()
  withJavadocJar()
}


test {
  useJUnitPlatform()

  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
}


testlogger {
  theme = 'mocha'
  slowThreshold = 3500
}


repositories {
  mavenCentral()
}


dependencies {
  // java
  compileOnlyApi libs.jetbrains.annotations

  // test
  testImplementation libs.junit.jupiter.api
  testImplementation libs.junit.jupiter.params
  testRuntimeOnly libs.junit.jupiter.engine
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


def resolvedJetbrainsAnnotationsVersion = configurations
    .compileClasspath
    .resolvedConfiguration
    .resolvedArtifacts
    .find { it.name == 'annotations' }
    .moduleVersion.id.version


javadoc {
  title = "Java ZBDD Library ${version}"

  (options as StandardJavadocDocletOptions).with {
    linksOffline "https://javadoc.io/doc/org.jetbrains/annotations/${resolvedJetbrainsAnnotationsVersion}/",
                 'gradle/javadocs/jetbrains-annotations'

    encoding = 'UTF-8'

    group 'ZBDD Core API', [ 'de.sayayi.lib.zbdd', 'de.sayayi.lib.zbdd.exception' ]
    group 'ZBDD Cache API', [ 'de.sayayi.lib.zbdd.cache' ]

    noQualifiers 'java.util', 'java.lang'

    addStringOption 'Xdoclint:-missing', '-quiet'
  }

  failOnError = false

  logging.captureStandardError(LogLevel.INFO)
}


tasks.withType(Jar).configureEach {
  reproducibleFileOrder = true

  manifest {
    attributes(
        'Implementation-Vendor': 'Jeroen Gremmen',
        'Implementation-Vendor-Id': 'de.sayayi.lib',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Created-By': System.getProperty('java.version'),
        'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ss')
    )
  }

  metaInf {
    from files('LICENSE')
  }
}


jar.dependsOn test


apply from: 'gradle/publish.gradle'


clean {
  delete layout.projectDirectory.dir('build')
}


wrapper {
  distributionType = Wrapper.DistributionType.BIN
}
